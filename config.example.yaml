# ── Expense Sync Configuration ───────────────────────────────────────────────
# Copy this file to config.yaml and fill in your values.

# Google Sheets settings
spreadsheet_id: "your-spreadsheet-id-from-the-url"  # from docs.google.com/spreadsheets/d/{THIS_PART}/edit
credentials_path: "credentials.json"  # Path to your Google service account JSON key
sheet_name: "expenses"  # Worksheet tab name (the raw data sheet; other tabs like dashboard/budget review can reference it)

# Names to match in Splitwise columns (partial, case-insensitive)
person_names:
  - "Alice"
  - "Bob"

# ── Wolt tax factor ───────────────────────────────────────────────────────────
# If Wolt payments come from pre-tax salary, set this to your marginal tax rate
# so each order amount is multiplied by it to reflect the true net cost.
# E.g. a factor below 1 discounts each NIS accordingly.
# Default: 1.0 (no adjustment).
wolt_tax_factor: 1.0

# ── Input files ──────────────────────────────────────────────────────────────
# Drop all export files into one folder. The script auto-detects file types:
#   .xlsx with Isracard header    → CC transaction file
#   .csv with ≤2 person columns   → Splitwise regular (1:1)
#   .csv with 3+ person columns   → Splitwise group
#   .csv with Wolt header         → Wolt order history
#     (tab-separated: Date, Category, Amount, Currency Symbol, Store)
#
# Safe to include multiple months of CC files — dedup handles overlaps.

input_dir: "example_input"
